<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת מודיעין נדל"ן - פנסילבניה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-slate-900 text-white py-6 px-4 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏛️</span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">US Real Estate Intelligence Agent</h1>
                    <p class="text-xs text-slate-400">איתור עסקאות מתחת לרדאר וזיהוי הזדמנויות | פנסילבניה (PA)</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-xs text-emerald-400">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>מחובר למאגר נתונים חי</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>🔍</span> סינון ופילוח שוק
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">עיר יעד</label>
                    <select id="filterCity" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ALL">כל הערים (All Cities)</option>
                        <option value="Philadelphia">Philadelphia</option>
                        <option value="Pittsburgh">Pittsburgh</option>
                        <option value="Allentown">Allentown</option>
                        <option value="Reading">Reading</option>
                        <option value="Erie">Erie</option>
                        <option value="Scranton">Scranton</option>
                        <option value="Lancaster">Lancaster</option>
                        <option value="Bethlehem">Bethlehem</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">מחיר מקסימלי ($)</label>
                    <input type="number" id="filterMaxPrice" value="500000" step="10000" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">סוג נכס</label>
                    <select id="filterType" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ALL">הכל</option>
                        <option value="Single Family">Single Family</option>
                        <option value="Multi Family">Multi Family</option>
                    </select>
                </div>

                <div class="flex items-end">
                    <button id="applyBtn" onclick="loadProperties()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm transition">
                        החל סינון והצג נכסים
                    </button>
                </div>
            </div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">נכסים שאותרו במאגר (<span id="resultsCount">0</span>)</h3>
            </div>
            
            <div id="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
                <p class="text-sm text-slate-500 mt-2">טוען נתונים חיים...</p>
            </div>

            <div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-slate-300">
                <p class="text-slate-500 text-base">לא נמצאו נכסים העונים לקריטריונים שנבחרו.</p>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://rroamddaivercqdaathp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyb2FtZGRhaXZlcmNxZGFhdGhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxOTU3ODAsImV4cCI6MjA4Nzc3MTc4MH0.g7kU2W27t7p4eL3w1sZJ-Bfqf9t7xJ9p4Xk2L-Bfqf9';

        async function fetchProperties() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/properties?select=*&order=price.asc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                return await response.json();
            } catch (e) {
                console.error("Fetch error:", e);
                return [];
            }
        }

        async function loadProperties() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('propertiesGrid');
            const empty = document.getElementById('emptyState');
            const countEl = document.getElementById('resultsCount');

            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            empty.classList.add('hidden');

            const city = document.getElementById('filterCity').value;
            const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || 99999999;
            const type = document.getElementById('filterType').value;

            let data = await fetchProperties();

            loading.classList.add('hidden');

            if (!Array.isArray(data) || data.length === 0) {
                empty.classList.remove('hidden');
                countEl.innerText = '0';
                return;
            }

            if (city !== 'ALL') {
                data = data.filter(item => item.city && item.city.toLowerCase() === city.toLowerCase());
            }
            if (type !== 'ALL') {
                data = data.filter(item => item.property_type && item.property_type.toLowerCase().includes(type.toLowerCase()));
            }
            data = data.filter(item => (Number(item.price) || 0) <= maxPrice);

            if (data.length === 0) {
                empty.classList.remove('hidden');
                countEl.innerText = '0';
                return;
            }

            countEl.innerText = data.length;
            grid.innerHTML = '';
            
            data.forEach(item => {
                const priceFormatted = Number(item.price).toLocaleString('en-US');
                const imgUrl = item.image_url || 'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800';
                const targetLink = item.external_url || `https://www.google.com/search?q=${encodeURIComponent((item.address || '') + ' ' + (item.city || '') + ' PA real estate')}`;

                const card = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="relative h-48 bg-slate-100 overflow-hidden">
                                <img src="${imgUrl}" alt="${item.address || 'נכס'}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800'">
                                <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-sm text-white text-xs font-semibold px-2.5 py-1 rounded-md">
                                    ${item.city || 'PA'}
                                </span>
                                ${item.is_relisted ? '<span class="absolute top-2 left-2 bg-amber-500 text-slate-900 text-xs font-bold px-2 py-1 rounded-md shadow">ירידת מחיר / הזדמנות</span>' : ''}
                            </div>

                            <div class="p-4 space-y-3">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-lg">$${priceFormatted}</h4>
                                        <p class="text-xs text-slate-500 font-medium">${item.address || 'פנסילבניה'}</p>
                                    </div>
                                    <span class="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200 font-medium">
                                        ${item.property_type || 'בית פרטי'}
                                    </span>
                                </div>

                                <div class="flex items-center gap-4 text-xs text-slate-600 border-y border-slate-100 py-2">
                                    <span>🛏️ ${item.beds || '-'} חד׳</span>
                                    <span>🚿 ${item.baths || '-'} רחצה</span>
                                    <span>📐 ${item.sqft ? Number(item.sqft).toLocaleString() + ' sqft' : '-'}</span>
                                </div>

                                <p class="text-xs text-slate-600 italic bg-blue-50/50 p-2 rounded border border-blue-100">
                                    💡 ${item.ai_summary || 'אותרה הזדמנות תמחור באזור ביקוש.'}
                                </p>
                            </div>
                        </div>

                        <div class="p-4 pt-0">
                            <a href="${targetLink}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-lg transition">
                                פתח דף נכס מלא ↗
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            grid.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', loadProperties);
    </script>
</body>
</html>
