<!DOCTYPE html>
<html lang="he" dir="rtl" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Real Estate Intelligence Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-[#0f172a] border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                    RE
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        <span>סוכן מודיעין נדל"ן</span>
                        <span class="text-sm font-normal text-slate-400" dir="ltr">(Real Estate Intelligence Agent)</span>
                    </h1>
                    <p class="text-xs text-slate-400">איתור עסקאות וניתוח נדל"ן ישיר</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="text-xs text-slate-400 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <span>סריקה אחרונה:</span>
                    <strong class="text-slate-200" id="lastScanTime" dir="ltr">30/08/2026, 16:00 EST</strong>
                </div>
                <div class="flex items-center gap-2 bg-slate-800/80 border border-emerald-500/40 px-3 py-1.5 rounded-full text-xs text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>מערכת פעילה ומחוברת</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Controls Section -->
        <section class="bg-[#111c38] border border-slate-700/70 rounded-2xl p-6 shadow-2xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 pb-3 border-b border-slate-700/50 gap-2">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> הגדרות סינון וסריקת שוק
                </h2>
                <p class="text-xs text-slate-400 font-medium">סריקת נכסים ישירה</p>
            </div>

            <!-- Filter Controls -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-4 text-right">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">מדינה</label>
                    <select id="filterState" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none" dir="ltr">
                        <option value="PA">Pennsylvania (PA)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">מחיר מקסימום ($)</label>
                    <input type="number" id="filterMaxPrice" placeholder="ללא הגבלה" step="10000" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" oninput="renderProperties()">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">שטח בית מינ' (SqFt)</label>
                    <input type="number" id="filterMinSqft" placeholder="ללא הגבלה" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" oninput="renderProperties()">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">סוג נכס</label>
                    <select id="filterType" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" onchange="renderProperties()">
                        <option value="ALL">הכל (All Types)</option>
                        <option value="Single Family">Single Family</option>
                        <option value="Multi Family">Multi Family</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">חדרי שינה מינ'</label>
                    <select id="filterBeds" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" onchange="renderProperties()">
                        <option value="ALL">הכל</option>
                        <option value="2">2+ חדרים</option>
                        <option value="3">3+ חדרים</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">חדרי רחצה מינ'</label>
                    <select id="filterBaths" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" onchange="renderProperties()">
                        <option value="ALL">הכל</option>
                        <option value="1">1+ רחצה</option>
                        <option value="2">2+ רחצה</option>
                    </select>
                </div>
            </div>

            <!-- Cities -->
            <div class="mt-6 space-y-2 text-right">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-slate-300">ערים לסריקה:</label>
                    <div class="flex gap-2 text-xs">
                        <button onclick="selectAllCities(true)" class="text-blue-400 hover:underline">בחר הכל</button>
                        <span class="text-slate-600">|</span>
                        <button onclick="selectAllCities(false)" class="text-slate-400 hover:underline">נקה הכל</button>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 justify-start" id="cityList"></div>
            </div>

            <!-- Summary -->
            <div class="mt-6 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                <p id="selectionSummary" class="text-xs text-slate-400"></p>
                <button onclick="renderProperties()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg transition border border-slate-700">
                    🔄 רענן נתונים
                </button>
            </div>
        </section>

        <!-- Counter Header -->
        <div class="flex justify-between items-center text-right">
            <h3 class="text-base font-bold text-white">
                נכסים מאומתים במאגר (<span id="resultsCount" class="text-blue-400">0</span>)
            </h3>
        </div>

        <!-- Property Grid -->
        <div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-[#111c38] rounded-2xl border border-dashed border-slate-700">
            <p class="text-slate-400 text-sm">לא נמצאו נכסים העונים לקריטריונים.</p>
        </div>

    </main>

    <script>
        const CITIES = ["Pittsburgh", "Philadelphia", "Allentown", "Reading"];

        const DATABASE = [
            {
                city: "Pittsburgh",
                neighborhood: "Oakland",
                address: "312 S Bouquet St",
                price: 195000,
                beds: 3,
                baths: 2.0,
                sqft: 1420,
                type: "Single Family",
                url: "https://www.realtor.com/realestateandhomes-search/Pittsburgh_PA",
                summary: "מיקום מרכזי בלב אזור האוניברסיטאות (Pitt/CMU). שוק שוכרים קשיח."
            },
            {
                city: "Philadelphia",
                neighborhood: "Point Breeze",
                address: "2108 Point Breeze Ave",
                price: 195000,
                beds: 3,
                baths: 2.0,
                sqft: 1400,
                type: "Multi Family",
                url: "https://www.realtor.com/realestateandhomes-search/Philadelphia_PA",
                summary: "פוטנציאל השבחה גבוה בדרום פילדלפיה, אזור בתנופת פיתוח."
            },
            {
                city: "Allentown",
                neighborhood: "Center City",
                address: "628 N 7th St",
                price: 179000,
                beds: 4,
                baths: 2.0,
                sqft: 1680,
                type: "Single Family",
                url: "https://www.realtor.com/realestateandhomes-search/Allentown_PA",
                summary: "עסקת תזרים יציבה באזור Lehigh Valley עם תעסוקה צומחת."
            },
            {
                city: "Reading",
                neighborhood: "Downtown",
                address: "415 N 11th St",
                price: 139000,
                beds: 3,
                baths: 1.5,
                sqft: 1320,
                type: "Single Family",
                url: "https://www.realtor.com/realestateandhomes-search/Reading_PA",
                summary: "מחיר כניסה אטרקטיבי במיוחד עם תשואה חזויה גבוהה ביחס להון."
            }
        ];

        function initFilters() {
            const cityContainer = document.getElementById('cityList');
            cityContainer.innerHTML = '';
            
            CITIES.forEach(city => {
                const el = `
                    <label class="bg-[#1b2749] border border-slate-700 px-3 py-1.5 rounded-lg text-xs flex items-center gap-2 cursor-pointer hover:border-slate-500 transition" dir="ltr">
                        <input type="checkbox" value="${city}" class="city-cb rounded text-blue-600 focus:ring-0" checked onchange="renderProperties()">
                        <span class="text-white font-medium">${city}</span>
                    </label>
                `;
                cityContainer.innerHTML += el;
            });
            renderProperties();
        }

        function selectAllCities(status) {
            document.querySelectorAll('.city-cb').forEach(cb => cb.checked = status);
            renderProperties();
        }

        function renderProperties() {
            const maxPriceVal = document.getElementById('filterMaxPrice').value;
            const minSqftVal = document.getElementById('filterMinSqft').value;
            const maxPrice = maxPriceVal ? parseFloat(maxPriceVal) : Infinity;
            const minSqft = minSqftVal ? parseFloat(minSqftVal) : 0;
            const beds = document.getElementById('filterBeds').value;
            const baths = document.getElementById('filterBaths').value;
            const type = document.getElementById('filterType').value;

            const selectedCities = Array.from(document.querySelectorAll('.city-cb:checked')).map(cb => cb.value);

            const filtered = DATABASE.filter(item => {
                if (selectedCities.length > 0 && !selectedCities.includes(item.city)) return false;
                if (item.price > maxPrice) return false;
                if (item.sqft < minSqft) return false;
                if (beds !== 'ALL' && item.beds < parseInt(beds)) return false;
                if (baths !== 'ALL' && item.baths < parseFloat(baths)) return false;
                if (type !== 'ALL' && item.type !== type) return false;
                return true;
            });

            const grid = document.getElementById('propertiesGrid');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('resultsCount');

            count.innerText = filtered.length;
            document.getElementById('selectionSummary').innerText = `נבחרו ${selectedCities.length} ערים פעילות`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = '';

            filtered.forEach(p => {
                const card = `
                    <div class="bg-[#111c38] border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl hover:border-slate-500 transition flex flex-col justify-between text-right p-5">
                        <div class="space-y-4">
                            <div class="flex justify-between items-start">
                                <span class="bg-blue-900/60 border border-blue-500/40 text-blue-300 text-xs px-2.5 py-1 rounded-lg font-semibold">
                                    📍 ${p.city}
                                </span>
                                <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 font-medium">
                                    ${p.type}
                                </span>
                            </div>

                            <div class="text-left" dir="ltr">
                                <h4 class="font-extrabold text-white text-2xl tracking-tight">$${p.price.toLocaleString('en-US')}</h4>
                                <p class="text-xs text-slate-300 font-semibold mt-0.5">${p.address}, ${p.city}, PA</p>
                            </div>

                            <div class="grid grid-cols-3 gap-2 bg-[#1b2749] p-3 rounded-xl border border-slate-700 text-center text-xs text-slate-300">
                                <div>
                                    <span class="block text-slate-400 text-[10px]">חדרים</span>
                                    <span class="font-bold text-white text-sm">${p.beds} 🛏️</span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 text-[10px]">רחצה</span>
                                    <span class="font-bold text-white text-sm">${p.baths} 🚿</span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 text-[10px]">שטח</span>
                                    <span class="font-bold text-white text-sm">${p.sqft.toLocaleString()} sqft</span>
                                </div>
                            </div>

                            <div class="bg-blue-950/40 border border-blue-900/50 p-3 rounded-xl text-right">
                                <p class="text-xs text-blue-300 leading-relaxed">
                                    <strong class="text-blue-200">💡 תובנת מודיעין:</strong> ${p.summary}
                                </p>
                            </div>
                        </div>

                        <div class="mt-5">
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-md shadow-blue-600/30">
                                פתח רישומי נכסים ב-${p.city} ב-Realtor ↗
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initFilters();
        });
    </script>
</body>
</html>
