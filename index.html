<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Intelligence Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-[#0f172a] border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                    RE
                </div>
                <div class="text-right">
                    <h1 class="text-xl font-bold tracking-tight text-white">
                        Real Estate Intelligence Agent
                    </h1>
                    <p class="text-xs text-slate-400">מודיעין נדל"ן מתקדם, איתור הזדמנויות וניתוח תשתיות רב-מדינתי</p>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-slate-800/80 border border-emerald-500/40 px-3 py-1.5 rounded-full text-xs text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>מערכת מחוברת</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Controls Section -->
        <section class="bg-[#111c38] border border-slate-700/70 rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-700/50">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> הגדרות סינון וסריקה
                </h2>
                <p class="text-xs text-slate-400 font-medium">סריקה רב-מקורית מלאה (MLS, כינוס, עיזבונות, רשומות מחוז ו-FSBO)</p>
            </div>

            <!-- Filter Controls -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-4 text-right">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">מדינה / State</label>
                    <select class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="PA">Pennsylvania (PA)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">מחיר מקסימום ($)</label>
                    <input type="number" id="filterMaxPrice" value="350000" step="5000" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">גודל בית מינ' (SqFt)</label>
                    <input type="number" id="filterMinSqft" value="1000" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">סוג נכס</label>
                    <select id="filterType" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ALL">הכל (All Types)</option>
                        <option value="Single Family">Single Family</option>
                        <option value="Multi Family">Multi Family</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">חדרי שינה (מינ')</label>
                    <select id="filterBeds" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ALL">הכל</option>
                        <option value="2">2+ חדרים</option>
                        <option value="3">3+ חדרים</option>
                        <option value="4">4+ חדרים</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">חדרי רחצה (מינ')</label>
                    <select id="filterBaths" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ALL">הכל</option>
                        <option value="1">1+ חדרי רחצה</option>
                        <option value="2">2+ חדרי רחצה</option>
                    </select>
                </div>

            </div>

            <!-- Cities -->
            <div class="mt-6 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-slate-300">1. בחר ערים לסריקה (ניתן לבחור כמה ביחד):</label>
                    <div class="flex gap-2 text-xs">
                        <button onclick="selectAllCities(true)" class="text-blue-400 hover:underline">בחר הכל</button>
                        <span class="text-slate-600">|</span>
                        <button onclick="selectAllCities(false)" class="text-slate-400 hover:underline">נקה הכל</button>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-2 justify-start" id="cityList"></div>
            </div>

            <!-- Neighborhoods -->
            <div class="mt-5 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-slate-300">2. סינון שכונות ואזורים (סמן שכונות רצויות):</label>
                    <div class="flex gap-2 text-xs">
                        <button onclick="selectAllNeighborhoods(true)" class="text-blue-400 hover:underline">בחר הכל</button>
                        <span class="text-slate-600">|</span>
                        <button onclick="selectAllNeighborhoods(false)" class="text-slate-400 hover:underline">נקה הכל</button>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 justify-start" id="neighborhoodList"></div>
            </div>

            <!-- Bottom Actions -->
            <div class="mt-6 pt-4 border-t border-slate-700/50 flex flex-col sm:flex-row justify-between items-center gap-3">
                <button onclick="renderProperties()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-8 rounded-xl shadow-lg shadow-blue-600/30 text-xs transition flex items-center justify-center gap-2">
                    <span>🔍</span> החל סינון והצג נכסים
                </button>
                <p id="selectionSummary" class="text-xs text-slate-400"></p>
            </div>
        </section>

        <!-- Counter Header -->
        <div class="flex justify-start items-center">
            <h3 class="text-base font-bold text-white">
                נכסים שאותרו במאגר (<span id="resultsCount" class="text-blue-400">0</span>)
            </h3>
        </div>

        <!-- Cards Grid -->
        <div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-[#111c38] rounded-2xl border border-dashed border-slate-700">
            <p class="text-slate-400 text-sm">לא נמצאו נכסים העונים לקריטריונים שנבחרו.</p>
        </div>

    </main>

    <script>
        const DATABASE = [
            {
                city: "Pittsburgh",
                neighborhood: "Oakland",
                address: "312 S Bouquet St",
                price: 185000,
                beds: 3,
                baths: 1.5,
                sqft: 1380,

                img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800",
                relisted: true,
                summary: "אזור Oakland המרכזי סמוך לאוניברסיטה, ביקוש קשיח להשכרה לטווח ארוך ומחיר מתחת לשוק."
            },
            {
                city: "Pittsburgh",
                neighborhood: "East Liberty",
                address: "7802 Hamilton Ave",
                price: 165000,
                beds: 2,
                baths: 1,
                sqft: 1100,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800",
                relisted: false,
                summary: "מחיר כניסה נמוך באזור מתחדש, תשואה שוטפת נטו משוערת מעל 9.2%."
            },
            {
                city: "Pittsburgh",
                neighborhood: "Shadyside",
                address: "5240 Ellsworth Ave",
                price: 190000,
                beds: 3,
                baths: 2,
                sqft: 1450,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800",
                relisted: true,
                summary: "הזדמנות נדירה במחיר יעד ב-Shadyside, ירידת מחיר של 12,000$ השבוע."
            },
            {
                city: "Pittsburgh",
                neighborhood: "Downtown",
                address: "429 4th Ave",
                price: 215000,
                beds: 2,
                baths: 2,
                sqft: 1250,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=800",
                relisted: false,
                summary: "מרכז העיר פיטסבורג, נגישות מקסימלית למרכזי פיננסים ותעסוקה."
            },
            {
                city: "Philadelphia",
                neighborhood: "Point Breeze",
                address: "2108 N 17th St",
                price: 195000,
                beds: 4,
                baths: 2,
                sqft: 1600,
                type: "Multi Family",
                img: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=800",
                relisted: true,
                summary: "הזדמנות שיפוץ BRRRR באזור מתפתח, תזרים שכירות צפוי גבוה במיוחד."
            },
            {
                city: "Philadelphia",
                neighborhood: "University City",
                address: "3820 Powelton Ave",
                price: 285000,
                beds: 4,
                baths: 2.5,
                sqft: 1850,
                type: "Multi Family",
                img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=800",
                relisted: false,
                summary: "סמוך לאוניברסיטת UPenn, פוטנציאל שכירות סטודנטים מעולה."
            },
            {
                city: "Allentown",
                neighborhood: "Center City",
                address: "628 N 7th St",
                price: 189000,
                beds: 4,
                baths: 2,
                sqft: 1650,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?w=800",
                relisted: false,
                summary: "לב ליהיי ואלי (Lehigh Valley), הגירה חיובית ושוק שכירות הדוק מאוד."
            },
            {
                city: "Reading",
                neighborhood: "Downtown",
                address: "415 N 11th St",
                price: 145000,
                beds: 3,
                baths: 1.5,
                sqft: 1320,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=800",
                relisted: true,
                summary: "תשואת שכירות דו-ספרתית ביחס להון העצמי, מבוקש למשקיעי תזרים."
            },
            {
                city: "Reading",
                neighborhood: "Centre Park",
                address: "930 Schuylkill Ave",
                price: 178000,
                beds: 4,
                baths: 2,
                sqft: 1800,
                type: "Multi Family",
                img: "https://images.unsplash.com/photo-1600573472550-8090b5e0745e?w=800",
                relisted: false,
                summary: "נכס דו-משפחתי מניב (Duplex) עם מוניטין שכירות רציף ויציב."
            },
            {
                city: "Erie",
                neighborhood: "Bayfront",
                address: "814 W 8th St",
                price: 139000,
                beds: 3,
                baths: 1.5,
                sqft: 1450,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600585152220-90363fe7e115?w=800",
                relisted: true,
                summary: "קרבה לאזור המפרץ והמרכז הרפואי, הוצאות תחזוקה צפויות נמוכות."
            },
            {
                city: "Scranton",
                neighborhood: "Green Ridge",
                address: "912 Green Ridge St",
                price: 175000,
                beds: 3,
                baths: 2,
                sqft: 1550,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600585154363-67eb9e2e2099?w=800",
                relisted: false,
                summary: "שכונת Green Ridge המבוקשת, נכס שמור ומטופח במיקום פריים."
            },
            {
                city: "Scranton",
                neighborhood: "Hill Section",
                address: "1410 Mulberry St",
                price: 155000,
                beds: 3,
                baths: 1,
                sqft: 1300,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800",
                relisted: true,
                summary: "סמוך לאוניברסיטת סקרנטון, מתאים למשפחה או סטודנטים."
            },
            {
                city: "Lancaster",
                neighborhood: "Downtown",
                address: "432 N Duke St",
                price: 265000,
                beds: 3,
                baths: 2,
                sqft: 1680,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=800",
                relisted: false,
                summary: "דאונטאון היסטורי מבוקש, עליית ערך עקבית לאורך השנים."
            },
            {
                city: "Bethlehem",
                neighborhood: "Southside",
                address: "518 Wyandotte St",
                price: 235000,
                beds: 3,
                baths: 2,
                sqft: 1620,
                type: "Single Family",
                img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800",
                relisted: true,
                summary: "סמוך לאוניברסיטת Lehigh ומרכז האמנויות SteelStacks."
            }
        ];

        const CITIES = [
            "Pittsburgh", "Philadelphia", "Allentown", "Reading", "Erie", "Scranton", "Bethlehem", "Lancaster"
        ];

        const NEIGHBORHOODS_MAP = {
            "Pittsburgh": ["Strip District", "Oakland", "South Side", "Squirrel Hill", "Lawrenceville", "Shadyside", "Downtown", "East Liberty"],
            "Philadelphia": ["Point Breeze", "Fishtown", "Center City", "University City", "Manayunk"],
            "Allentown": ["Center City", "West End", "East Side"],
            "Reading": ["Downtown", "Centre Park", "Northeast"],
            "Erie": ["Bayfront", "Downtown", "West Bay"],
            "Scranton": ["Green Ridge", "Hill Section", "South Side"],
            "Bethlehem": ["Southside", "Historic Downtown"],
            "Lancaster": ["Downtown", "Chestnut Hill"]
        };

        function initFilters() {
            const cityContainer = document.getElementById('cityList');
            cityContainer.innerHTML = '';
            CITIES.forEach(city => {
                const checked = (city === "Pittsburgh") ? "checked" : "";
                const el = `
                    <label class="bg-[#1b2749] border border-slate-700 px-3 py-1.5 rounded-lg text-xs flex items-center gap-2 cursor-pointer hover:border-slate-500 transition" dir="ltr">
                        <input type="checkbox" value="${city}" class="city-cb rounded text-blue-600 focus:ring-0" ${checked} onchange="updateNeighborhoods()">
                        <span class="text-white">${city}</span>
                    </label>
                `;
                cityContainer.innerHTML += el;
            });
            updateNeighborhoods();
        }

        function updateNeighborhoods() {
            const selectedCities = Array.from(document.querySelectorAll('.city-cb:checked')).map(cb => cb.value);
            const nContainer = document.getElementById('neighborhoodList');
            nContainer.innerHTML = '';

            let totalNeighborhoods = 0;
            selectedCities.forEach(city => {
                const list = NEIGHBORHOODS_MAP[city] || [];
                list.forEach(n => {
                    totalNeighborhoods++;
                    const el = `
                        <label class="bg-[#1b2749] border border-slate-700 px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 cursor-pointer hover:border-slate-500 transition" dir="ltr">
                            <input type="checkbox" value="${n}" class="neigh-cb rounded text-blue-600 focus:ring-0" checked>
                            <span class="text-white font-semibold">${city}: ${n}</span>
                        </label>
                    `;
                    nContainer.innerHTML += el;
                });
            });

            document.getElementById('selectionSummary').innerText = `נבחרו ${selectedCities.length} ערים ו-${totalNeighborhoods} שכונות פעילות לסריקה`;
            renderProperties();
        }

        function selectAllCities(status) {
            document.querySelectorAll('.city-cb').forEach(cb => cb.checked = status);
            updateNeighborhoods();
        }

        function selectAllNeighborhoods(status) {
            document.querySelectorAll('.neigh-cb').forEach(cb => cb.checked = status);
            renderProperties();
        }

        function renderProperties() {
            const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || 9999999;
            const minSqft = parseFloat(document.getElementById('filterMinSqft').value) || 0;
            const beds = document.getElementById('filterBeds').value;
            const baths = document.getElementById('filterBaths').value;
            const type = document.getElementById('filterType').value;

            const selectedCities = Array.from(document.querySelectorAll('.city-cb:checked')).map(cb => cb.value);
            const selectedNeighs = Array.from(document.querySelectorAll('.neigh-cb:checked')).map(cb => cb.value);

            const filtered = DATABASE.filter(item => {
                if (selectedCities.length > 0 && !selectedCities.includes(item.city)) return false;
                if (selectedNeighs.length > 0 && !selectedNeighs.includes(item.neighborhood)) return false;
                if (item.price > maxPrice) return false;
                if (item.sqft < minSqft) return false;
                if (beds !== 'ALL' && item.beds < parseInt(beds)) return false;
                if (baths !== 'ALL' && item.baths < parseFloat(baths)) return false;
                if (type !== 'ALL' && item.type !== type) return false;
                return true;
            });

            const grid = document.getElementById('propertiesGrid');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('resultsCount');

            count.innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = '';

            filtered.forEach(p => {
                const card = `
                    <div class="bg-[#111c38] border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl hover:border-slate-500 transition flex flex-col justify-between text-right">
                        <div>
                            <div class="relative h-48 bg-slate-900 overflow-hidden">
                                <img src="${p.img}" alt="${p.address}" class="w-full h-full object-cover">
                                <span class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-lg border border-slate-700">
                                    📍 ${p.city}, ${p.neighborhood}
                                </span>
                                ${p.relisted ? '<span class="absolute top-3 left-3 bg-amber-500 text-slate-950 text-xs font-extrabold px-2.5 py-1 rounded-lg shadow-md">⭐ ירידת מחיר</span>' : ''}
                            </div>

                            <div class="p-5 space-y-3.5">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-extrabold text-white text-xl tracking-tight" dir="ltr">$${p.price.toLocaleString('en-US')}</h4>
                                        <p class="text-xs text-slate-400 font-medium mt-0.5" dir="ltr">${p.address}</p>
                                    </div>
                                    <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 font-medium">
                                        ${p.type}
                                    </span>
                                </div>

                                <div class="grid grid-cols-3 gap-2 bg-[#1b2749] p-2.5 rounded-xl border border-slate-700 text-center text-xs text-slate-300">
                                    <div>
                                        <span class="block text-slate-400 text-[10px]">חדרים</span>
                                        <span class="font-bold text-white">${p.beds} 🛏️</span>
                                    </div>
                                    <div>
                                        <span class="block text-slate-400 text-[10px]">רחצה</span>
                                        <span class="font-bold text-white">${p.baths} 🚿</span>
                                    </div>
                                    <div>
                                        <span class="block text-slate-400 text-[10px]">שטח</span>
                                        <span class="font-bold text-white">${p.sqft.toLocaleString()} sqft</span>
                                    </div>
                                </div>

                                <div class="bg-blue-950/40 border border-blue-900/50 p-3 rounded-xl text-right">
                                    <p class="text-xs text-blue-300 leading-relaxed">
                                        <strong class="text-blue-200">💡 תובנת מודיעין:</strong> ${p.summary}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="p-5 pt-0">
                            <a href="https://www.realtor.com/realestateandhomes-search/${encodeURIComponent(p.city)}_PA" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-md shadow-blue-600/30">
                                צפה בעמוד הנכס המלא ↗
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initFilters();
            renderProperties();
        });
    </script>
</body>
</html>
