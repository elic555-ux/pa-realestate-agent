<!DOCTYPE html>
<html lang="he" dir="rtl" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Real Estate Intelligence Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-[#0f172a] border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                    RE
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        <span>סוכן מודיעין נדל"ן</span>
                        <span class="text-sm font-normal text-slate-400" dir="ltr">(Real Estate Intelligence Agent)</span>
                    </h1>
                    <p class="text-xs text-slate-400">איתור עסקאות וניתוח השקעות ישיר</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-800/80 border border-emerald-500/40 px-3 py-1.5 rounded-full text-xs text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>סנכרון נתונים פעיל</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Controls Section -->
        <section class="bg-[#111c38] border border-slate-700/70 rounded-2xl p-6 shadow-2xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 pb-3 border-b border-slate-700/50 gap-2">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> סינון נכסים
                </h2>
                <p class="text-xs text-slate-400">טעינה ישירה ממאגר המודיעין של הסוכן</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-right">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">מחיר מקסימום ($)</label>
                    <input type="number" id="filterMaxPrice" placeholder="ללא הגבלה" step="10000" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" oninput="renderProperties()">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">שטח בית מינ' (SqFt)</label>
                    <input type="number" id="filterMinSqft" placeholder="ללא הגבלה" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" oninput="renderProperties()">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">חדרי שינה מינ'</label>
                    <select id="filterBeds" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" onchange="renderProperties()">
                        <option value="ALL">הכל</option>
                        <option value="2">2+ חדרים</option>
                        <option value="3">3+ חדרים</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">סוג נכס</label>
                    <select id="filterType" class="w-full bg-[#1b2749] border border-slate-700 text-white rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-right" onchange="renderProperties()">
                        <option value="ALL">הכל</option>
                        <option value="Single Family">Single Family</option>
                        <option value="Townhouse">Townhouse</option>
                        <option value="Multi Family">Multi Family</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Counter Header -->
        <div class="flex justify-between items-center text-right">
            <h3 class="text-base font-bold text-white">
                נכסים במאגר (<span id="resultsCount" class="text-blue-400">0</span>)
            </h3>
        </div>

        <!-- Property Grid -->
        <div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-[#111c38] rounded-2xl border border-dashed border-slate-700">
            <p class="text-slate-400 text-sm">לא נמצאו נכסים העונים לסינון.</p>
        </div>

    </main>

    <script>
        let properties = [];

        async function loadData() {
            try {
                const res = await fetch('properties.json?t=' + Date.now());
                properties = await res.json();
                renderProperties();
            } catch (e) {
                console.error("Failed to load properties.json", e);
            }
        }

        function renderProperties() {
            const maxPriceVal = document.getElementById('filterMaxPrice').value;
            const minSqftVal = document.getElementById('filterMinSqft').value;
            const maxPrice = maxPriceVal ? parseFloat(maxPriceVal) : Infinity;
            const minSqft = minSqftVal ? parseFloat(minSqftVal) : 0;
            const beds = document.getElementById('filterBeds').value;
            const type = document.getElementById('filterType').value;

            const filtered = properties.filter(item => {
                if (item.price > maxPrice) return false;
                if (item.sqft < minSqft) return false;
                if (beds !== 'ALL' && item.beds < parseInt(beds)) return false;
                if (type !== 'ALL' && item.type !== type) return false;
                return true;
            });

            const grid = document.getElementById('propertiesGrid');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('resultsCount');

            count.innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = '';

            filtered.forEach(p => {
                const card = `
                    <div class="bg-[#111c38] border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between text-right space-y-4 hover:border-slate-500 transition">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start">
                                <span class="bg-blue-900/60 border border-blue-500/40 text-blue-300 text-xs px-2.5 py-1 rounded-lg font-semibold" dir="ltr">
                                    📍 ${p.city}${p.neighborhood ? ', ' + p.neighborhood : ''}
                                </span>
                                ${p.relisted ? '<span class="bg-amber-500 text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded shadow">⭐ ירידת מחיר</span>' : ''}
                            </div>

                            <div class="text-left" dir="ltr">
                                <h4 class="font-extrabold text-white text-2xl tracking-tight">$${p.price.toLocaleString('en-US')}</h4>
                                <p class="text-xs text-slate-300 font-semibold mt-0.5">${p.address}, ${p.city}, ${p.state || 'PA'}</p>
                            </div>

                            <div class="grid grid-cols-3 gap-2 bg-[#1b2749] p-2.5 rounded-xl border border-slate-700 text-center text-xs text-slate-300">
                                <div><span class="block text-slate-400 text-[10px]">חדרים</span><span class="font-bold text-white">${p.beds} 🛏️</span></div>
                                <div><span class="block text-slate-400 text-[10px]">רחצה</span><span class="font-bold text-white">${p.baths} 🚿</span></div>
                                <div><span class="block text-slate-400 text-[10px]">שטח</span><span class="font-bold text-white">${p.sqft.toLocaleString()} sqft</span></div>
                            </div>

                            <div class="bg-blue-950/40 border border-blue-900/50 p-3 rounded-xl text-right">
                                <p class="text-xs text-blue-300 leading-relaxed"><strong class="text-blue-200">💡 מודיעין:</strong> ${p.summary || 'נכס מאומת לניתוח השקעה'}</p>
                            </div>
                        </div>

                        <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-md">
                            פתח עמוד נכס מאומת ↗
                        </a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
